# Render Blueprint: one FastAPI web service.  The database is Supabase PostgreSQL
# (external), so there is no Render database block.
# Render dashboard -> New -> Blueprint -> pick this repository.
services:
  - type: web
    name: pocketsmart-ai
    runtime: python
    plan: free            # free web services sleep after 15 min idle
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /startup
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL        # Supabase "Session pooler" connection string (with DB password)
        sync: false
      - key: SUPABASE_PROJECT_NAME
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false       # leave blank for offline mode
      - key: CORS_ORIGINS
        value: https://pocketsmart-ai-theta.vercel.app
